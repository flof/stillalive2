services:
  stillalive:
    build: .
    image: stillalive:local
    container_name: stillalive
    user: "${UID}:${GID}"
    restart: unless-stopped
    networks:
      - default
      - caddy
    env_file:
      - .env
    environment:
      ADDR: ":8080"
      DATABASE_PATH: /data/stillalive.db
      SESSION_SECURE: "true"
    volumes:
      - ./data:/data

networks:
  caddy:
    external: true
