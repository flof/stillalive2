services:
  stillalive:
    build: .
    image: stillalive:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      ADDR: ":8080"
      DATABASE_PATH: /data/stillalive.db
      SESSION_SECURE: "true"
    volumes:
      - stillalive-data:/data

volumes:
  stillalive-data:
